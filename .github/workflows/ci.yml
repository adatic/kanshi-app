name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      # 詩語頻度表の再現の確認に全唐詩が要る（リポジトリには入れていない。data/corpus.json のハッシュで検証して取得する）
      - uses: actions/cache@v4
        with:
          path: .cache
          key: corpus-${{ hashFiles('data/corpus.json') }}
      - run: python3 scripts/fetch_corpus.py
      - run: npm test
